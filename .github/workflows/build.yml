name: Test & build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to attach the .exe files to a release on version tags

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - run: xvfb-run -a npm run test:electron

  windows:
    name: Tests + build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: npm test
      - run: npm run test:electron
      # Release when main (or a manual run) has a package.json version with no
      # GitHub Release yet, or when a matching v* tag is pushed.
      - name: Decide whether to release
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$v is already released; bump package.json version to publish a new one."
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dachshund-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots-windows
          path: test-output/
      - name: Publish GitHub Release
        if: steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Desktop Dachshund ${{ steps.rel.outputs.version }}
          generate_release_notes: true
          # latest.yml + .blockmap are what installed copies read to auto-update
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
